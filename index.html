<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>JS5-Desafio 4</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white flex items-center justify-center">
  <main class="w-full min-h-screen flex flex-col lg:flex-row items-center justify-center p-6 gap-8 max-w-[1400px] mx-auto">
    <section class="w-full lg:w-1/3 flex-1 flex justify-center items-center">
      <article class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl overflow-hidden transition-all duration-300 hover:border-slate-700">
        <header class="p-6 border-b text-center border-slate-800/80 bg-slate-900/50">
          <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
            Registrar vehículo
          </h1>
        </header>

        <form id="form-producto" class="p-6 flex flex-col gap-5">
          <div class="flex flex-col gap-2">
            <label for="marca" class="text-xs font-semibold uppercase tracking-wider text-slate-300">Marca</label>
            <input id="marca" type="text" placeholder="Ej. Toyota" class="w-full px-4 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all placeholder:text-xs">
            <span id="error-marca" class="hidden text-xs text-rose-400 font-medium"></span>
          </div>

          <div class="flex flex-col gap-2">
            <label for="modelo" class="text-xs font-semibold uppercase tracking-wider text-slate-300">Modelo</label>
            <input id="modelo" type="text" placeholder="Ej. Corolla" class="w-full px-4 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all placeholder:text-xs">
            <span id="error-modelo" class="hidden text-xs text-rose-400 font-medium"></span>
          </div>

          <div class="flex flex-col gap-2">
            <label for="color" class="text-xs font-semibold uppercase tracking-wider text-slate-300">Color</label>
            <input id="color" type="text" placeholder="Ej. Negro" class="w-full px-4 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all placeholder:text-xs">
            <span id="error-color" class="hidden text-xs text-rose-400 font-medium"></span>
          </div>

          <div class="flex flex-col gap-2">
            <label for="año" class="text-xs font-semibold uppercase tracking-wider text-slate-300">Año del vehículo</label>
            <input id="año" type="number" placeholder="Ej. 2026" class="w-full px-4 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none placeholder:text-xs">
            <span id="error-año" class="hidden text-xs text-rose-400 font-medium"></span>
          </div>

          <div class="pt-2">
            <button id="btnAdd" type="submit" class="w-full py-3 px-4 bg-sky-600 hover:bg-sky-700 active:bg-sky-700 text-white font-semibold rounded-xl shadow-lg transition-all duration-200 cursor-pointer">
              Agregar Vehículo
            </button>
          </div>

        </form>
      </article>
    </section>

    <section class="w-full lg:w-1/2 flex-1 flex justify-center items-center">
      <div class="w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300 border-collapse">
            <thead class="text-xs uppercase tracking-wider text-slate-400 bg-slate-950/60 border-b border-slate-800">
              <tr>
                <th scope="col" class="px-6 py-4 font-semibold">Marca</th>
                <th scope="col" class="px-6 py-4 font-semibold">Modelo</th>
                <th scope="col" class="px-6 py-4 font-semibold">Color</th>
                <th scope="col" class="px-6 py-4 font-semibold">Año</th>
                <th scope="col" class="px-6 py-4 font-semibold text-center">Acción</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/60 font-medium"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center gap-4 transition-all duration-300">
    <div class="w-12 h-12 border-4 border-slate-800 border-t-sky-600 rounded-full animate-spin"></div>
    <p class="text-slate-200 text-sm font-medium tracking-wide">Cargando...</p>
  </div>
  <script src="./js/main.js"></script>
</body>
</html>
